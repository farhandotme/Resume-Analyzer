# nginx config for the Resume Analyzer frontend container.
# Serves the built Vite SPA and reverse-proxies /api/* to the node backend
# (the "node" service on the docker network), stripping the /api prefix so
# that e.g. /api/resume/analyze -> http://node:3000/resume/analyze.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload size for resume PDFs going through this origin
    client_max_body_size 15m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API reverse proxy ────────────────────────────
    # Frontend calls VITE_NODE_BACKEND_URL=/api/... ; this strips /api and
    # forwards to the node backend service.
    location /api/ {
        proxy_pass http://node:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Resume analysis can take a while (PDF parsing + LLM calls);
        # keep the proxy connection open long enough for it to finish.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ── Static assets (hashed filenames from the Vite build) ────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────
    # react-router-dom handles routing client-side, so any unmatched path
    # falls back to index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ── HTTPS (recommended for production) ────────────────────────────
# Terminate TLS at this container (or, more commonly, at an external
# load balancer / reverse proxy such as a cloud provider's LB, Cloudflare,
# or a separate nginx+certbot container in front of this one). If you
# want this container to terminate TLS directly with certificates from
# Let's Encrypt, uncomment and adapt the block below, mount your certs,
# and change the "listen 80" block above to redirect to https.
#
# server {
#     listen 443 ssl http2;
#     server_name your-domain.com;
#
#     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#
#     root /usr/share/nginx/html;
#     index index.html;
#     ... (same location blocks as above)
# }
