server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively; Vite fingerprints filenames
    # so a new deploy automatically busts the cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Simple liveness probe for the container healthcheck / load balancer.
    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # SPA fallback: let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the Node backend. The frontend calls VITE_NODE_BACKEND_URL
    # (set to "/api" by default), so a request to /api/resume/analyze here
    # becomes http://node:3000/resume/analyze — same-origin from the browser's
    # point of view, so no CORS handling is needed at all.
    location /api/ {
        proxy_pass http://node:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Resume analysis polls a long-running job; keep the connection open.
        proxy_read_timeout 120s;
    }
}
